# kwbackup config — пример. Все ключи опциональны, если не сказано иное.
# Валидация: kwbackup.py -c этот-файл.yaml --check-config
#
# Retention: для каждого класса (DAILY/WEEKLY/MONTHLY) указывается РОВНО ОДНО
# из двух, взаимоисключающих правил:
#   keep: N      — оставить N самых новых копий (не зависит от пропусков запусков)
#   max_age: 7d  — удалять всё старше указанного возраста
# Оба сразу — ошибка конфига. Ни одного — тоже ошибка (класс отключается через
# `daily: false` или отсутствие ключа класса).
# Глобальный `retention_mode: keep|max_age` (опционально) запрещает смешивать
# правила в одном конфиге.
#
# Расписание: WEEKLY создаётся дополнительно к DAILY по понедельникам,
# MONTHLY — 1-го числа. `catch_up: true` включает догон: если за текущую
# ISO-неделю / текущий месяц копии ещё нет, она будет создана при следующем
# запуске (защита от «хост лежал в понедельник»).

version: 1
project: example                  # имя проекта: lock-файлы, логи, отчёты

log:
  level: info                     # debug | info | warning | error
  file: /var/log/kwbackup/example.log

runtime:
  temp_dir: /tmp/kwbackup         # сюда пишутся дампы перед заливкой
  keep_temp: false                # true = не удалять дамп после заливки

rclone:
  binary: rclone
  config: /etc/kwbackup/rclone.conf
  remote: beget                   # имя remote из rclone.conf
  args:                           # добавляются к каждому вызову rclone
    - --s3-no-check-bucket
  env:                            # секреты подставляются из окружения
    AWS_ACCESS_KEY_ID: ${RCLONE_KEY_ID}
    AWS_SECRET_ACCESS_KEY: ${RCLONE_SECRET}

database:
  enabled: true
  type: mariadb                   # mysql | mariadb | postgres | sqlite
  host: localhost
  port: 3306
  user: backup                    # mysql/mariadb: --user, postgres: --username
  password_env: MYSQL_PWD         # читается из окружения, в конфиг не пишется
  args:                           # опции дампа; ниже — дефолты
    - --single-transaction
    - --quick
    - --no-tablespaces
  compressor: zstd                # zstd | gzip | pigz | rar | none
  compressor_args: ["-3"]
  target: "beget:/DB"             # одна БД → beget:/DB/DAILY, несколько → beget:/DB/<db>/DAILY
  databases:
    - mediamaker
  retention_mode: keep            # опционально: keep | max_age (без смешивания)
  catch_up: false                 # true = догонять пропущенные weekly/monthly
  retention:
    daily:
      keep: 8                     # эквивалент прежнего DB_MIN_AGE_DAILY=7d
    weekly:
      keep: 6                     # эквивалент DB_MIN_AGE_WEEKLY=43d
    monthly:
      keep: 12                    # эквивалент DB_MIN_AGE_MONTHLY=360d
    # Альтернативная форма (не смешивать с keep в том же классе):
    # daily: {max_age: 7d}

storage:
  enabled: false
  mode: sync                      # sync | copy
  target: "beget:/STORAGE"
  sources: []                     # ["/srv/files", ...]

archive:
  enabled: false
  compressor: zstd
  compressor_args: ["-9"]
  name: example                   # к имени автоматически добавляется _<timestamp>
  root: /srv/example
  include: ["*"]
  exclude: ["*.mp4"]
  target: "beget:/ARCHIVE"
  retention: {keep: 5}
