# debian/kwbackup.defaults.yaml — conffile пакета, устанавливается как
# /etc/kwbackup/defaults.yaml (см. override_dh_install в debian/rules).
#
# Это единственный файл, который читает программа. Ниже него лежат встроенные
# дефолты (src/05_builtin_defaults.py): если ключа здесь нет, берётся оттуда.
# Выше — файл задачи, указанный в --config; он перекрывает любой ключ отсюда.
# Удалённый из этого файла ключ снова начинает браться из встроенных дефолтов.
#
# Файл сознательно содержит НЕ МЕНЬШЕ ключей, чем встроенные дефолты: сюда
# смотрят, чтобы узнать значения по умолчанию, а не в исходники.
#
# Установка из .deb кладёт его как conffile с правами 0644. Если добавите сюда
# ключи бакета, сделайте chmod 600 — программа права не проверяет.

log:
  level: info
  file: /var/log/kwbackup/kwbackup.log
  syslog: false             # true = системный сокет /dev/log; можно путь к сокету
  facility: daemon          # кем писать в syslog: daemon, user, local0..local7 ...
                            # оба стока независимы: можно писать в файл и в syslog

runtime:
  temp_dir: /tmp/kwbackup
  keep_temp: false          # true = не удалять локальную копию после заливки
  verbose: false            # = --verbose: консоль на info + rclone --progress
  debug: false              # = --debug: консоль на debug (включает verbose)
  hook_timeout: 60          # таймаут одного before/after-хука, секунды

# Версионный бэкап файлов (задача vault). Полная схема — в docs/.
vault:
  enabled: false
  volume_size: 2G           # ориентир тома TAR; файлы не режем
  checksum: none            # none | sha256

# Уведомления. Пустой `on` (или отсутствие каналов) = полностью выключено,
# включая записи в лог. Сообщение содержит только: файл задачи, проект, хост,
# тип запуска, статус, длительность, сводку по действиям и имена того, что
# сломалось (БД, апстрим, причина). Команд и ключей в нём нет.
notify:
  on: [failure]             # failure | success | always; [] или null = выкл.
  retries: 0                # повторов доставки на канал
  retry_delay: 3            # пауза между попытками, секунды
  timeout: 10               # таймаут SMTP/HTTP, секунды
  # mail:
  #   to: [admin@example.com]
  #   from: kwbackup@host
  #   smtp_host: localhost
  #   port: 25
  #   tls: false
  #   user_env: SMTP_USER
  #   password_env: SMTP_PASS
  # webhook:
  #   url: https://monitor.example/hook
  #   headers: {Authorization: "Bearer ${HOOK_TOKEN}"}
  # telegram:
  #   token_env: TG_TOKEN
  #   chat_id: "..."
rclone:
  binary: rclone
  args:
    - --s3-no-check-bucket
  env: {}
  # Расширенный путь: флаги бэкенда без "--". Перекрываются в upstreams и в
  # секциях database/storage/archive; null убирает унаследованный флаг.
  # s3-custom-options:
  #   s3-chunk-size: 5M
  #   s3-upload-cutoff: 200M

# Апстримы (назначения): ключ = имя remote в targets. Хотя бы один обязателен
# в итоговом конфиге — здесь или в файле задачи.
# upstreams:
#   s3a:
#     config: /etc/kwbackup/rclone_s3a.conf
#     s3-custom-options:
#       s3-access-key-id: ${S3A_KEY}
#       s3-secret-access-key: ${S3A_SECRET}
#       s3-no-check-bucket: true

database:
  type: mariadb             # mysql | mariadb | postgres | sqlite
  host: localhost
  # port: 3306              # по умолчанию порт клиента; 3306 неверен для postgres
  user: backup
  password_env: MYSQL_PWD
  compressor: zstd          # zstd | gzip | pigz | rar | none
  compressor_args: ["-3"]
  mode: copy                # в конфиге допустим только copy; -m sync — из CLI
  catch_up: false           # true = догонять пропущенные weekly/monthly
  ignore_table: []          # таблицы, которые не дампить; db.table или просто table
  # enabled: false          # false = --restore --database требует --force
  restore: {enabled: true}
  retention_mode: keep      # keep | max_age; запрещает смешивать правила
  retention:
    daily:
      keep: 8
    weekly:
      keep: 6
    monthly:
      keep: 12
    # daily: {max_age: 7d}  # альтернатива, не смешивать в одном классе

storage:
  mode: sync                # sync = зеркало, copy = только доливать
  allow_empty: false        # true = разрешить sync из пустого каталога
  restore: {enabled: true}  # false = --restore --storage требует --force

archive:
  compressor: zstd          # zstd | gzip | pigz | rar | none
  compressor_args: ["-9"]
  # name: site              # префикс файла; по умолчанию = project
  include: ["*"]            # "*" = весь root, включая dotfiles
  exclude: []
  mode: copy                # в конфиге допустим только copy; -m sync — из CLI
  restore: {enabled: true}  # false = --restore --archive требует --force
  # retention: {keep: 5}    # нет ключа = архив не чистится НИКОГДА
  # retention_mode: keep

# ---------------------------------------------------------------- incremental
# Цепочки GNU tar: полный дамп раз в месяц + ежедневные инкременты.
incremental:
  enabled: false
  initial_day: 1            # день месяца, с которого начинается новая цепочка (1..28)
  include: ["*"]
  exclude: []
  restore: {enabled: true}  # false = --restore --incremental требует --force
  # snapshot: /var/lib/kwbackup/<project>.snar   # обязателен при enabled: true
  # targets: [s3a:/INCR]
  # retention: {keep: 3}    # число цепочек (месяцев)
