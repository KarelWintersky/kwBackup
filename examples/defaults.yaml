# /etc/kwbackup/defaults.yaml — общие настройки для всех задач на этом хосте.
#
# Это единственный путь, который читает программа: /etc/kwbackup/defaults.yaml.
# Ниже него лежат встроенные дефолты (src/05_builtin_defaults.py), выше —
# файл задачи, указанный в --config. Файла нет — работают только встроенные.
#
# Установка из .deb кладёт этот файл как conffile с правами 0644. Если
# положите сюда ключи бакета, сделайте chmod 600: проверка прав предупредит.
#
# Задача перекрывает любое значение. Списки `rclone.args`, `database.args`,
# `database.compressor_args`, `archive.compressor_args` и `archive.exclude`
# ДОПОЛНЯЮТСЯ (дефолты + задача), остальные списки заменяются целиком
# (`databases`, `storage.sources`, `archive.include`).

version: 1

log:
  level: info
  file: /var/log/kwbackup/kwbackup.log   # общий лог на все задачи

runtime:
  temp_dir: /tmp/kwbackup

# Проверка прав на файлы, где ключи доступа передаются флагами rclone
# (--s3-access-key-id / --s3-secret-access-key): если такой файл читаем
# группой или остальными, --check-config и каждый запуск печатают
# предупреждение с предложением chmod 600. Проверяются файл задачи и этот
# файл дефолтов. Ключи внутри rclone.conf — нормальный сценарий (они на
# аккаунт), он не проверяется.
# false — отключить, например когда конфиги лежат на read-only монтировании
# с правами, которые вы всё равно не можете изменить.
security:
  check_excessive_access_rights: true

rclone:
  config: /etc/kwbackup/rclone_beget.conf
  remote: beget
  args:
    - --s3-no-check-bucket
    # BEGET выдаёт access key / secret key на БАКЕТ (как minio), а не на
    # аккаунт, и в rclone.conf стоит env_auth = false. Поэтому ключи
    # передаются флагами rclone в файле задачи:
    #   --s3-access-key-id=...
    #   --s3-secret-access-key=...
    # Если бакет один на весь хост — можно держать ключи прямо здесь,
    # тогда файлы задач будут совсем короткими.

database:
  type: mariadb
  host: localhost
  user: backup
  password_env: MYSQL_PWD
  compressor: zstd
  compressor_args: ["-3"]
  catch_up: false
  retention:
    daily:   {keep: 8}
    weekly:  {keep: 6}
    monthly: {keep: 12}

archive:
  compressor: zstd
  compressor_args: ["-9"]
  retention: {keep: 5}
