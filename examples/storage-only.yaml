# Синхронизация файлового storage. Общие настройки — в /etc/kwbackup/defaults.yaml.
project: uploads

rclone:
  # Ключи бакета можно флагами (простой путь) или через s3-custom-options:
  #   args: ["--s3-access-key-id=...", "--s3-secret-access-key=..."]
  # Здесь показан расширенный путь. Значения перекрывают rclone.s3-custom-options
  # и rclone.args для этого действия.
  s3-custom-options:
    s3-access-key-id: <ACCESS_KEY_BUCKET_UPLOADS>
    s3-secret-access-key: <SECRET_KEY_BUCKET_UPLOADS>
    s3-chunk-size: 5M

storage:
  enabled: true
  mode: sync              # sync = зеркало; copy = только доливать
  target: "beget:/uploads"
  sources:
    - /srv/app/uploads
    - path: /srv/app/static
      dest: static
