# Синхронизация файлового storage. Общие настройки — в /etc/kwbackup/defaults.yaml.
project: uploads

upstreams:
  # ключи бакета -> s3-custom-options; простой путь через args: тоже работает
  beget:
    config: /etc/kwbackup/rclone_beget.conf
    s3-custom-options:
      s3-access-key-id: <ACCESS_KEY_BUCKET_UPLOADS>
      s3-secret-access-key: <SECRET_KEY_BUCKET_UPLOADS>
      s3-chunk-size: 5M

storage:
  enabled: true
  mode: sync              # sync = зеркало; copy = только доливать
  targets: ["beget:/uploads"]
  sources:
    - /srv/app/uploads
    - path: /srv/app/static
      dest: static
