# Синхронизация файлового storage. Общие настройки — в kwbackup_defaults.yaml.
version: 1
project: uploads

rclone:
  args:
    - "--s3-access-key-id=<ACCESS_KEY_BUCKET_UPLOADS>"
    - "--s3-secret-access-key=<SECRET_KEY_BUCKET_UPLOADS>"

storage:
  enabled: true
  mode: sync              # sync = зеркало; copy = только доливать
  target: "beget:/uploads"
  sources:
    - /srv/app/uploads
    - path: /srv/app/static
      dest: static
