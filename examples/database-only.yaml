# Бэкап БД. Общие настройки (log, компрессор, retention) берутся
# из /etc/kwbackup/defaults.yaml — см. debian/kwbackup.defaults.yaml.
project: shop

# Апстрим: имя = префикс в targets. Здесь ключи бакета (BEGET выдаёт их
# на бакет), поэтому файл задачи держите с правами 0600.
upstreams:
  beget:
    config: /etc/kwbackup/rclone_beget.conf
    s3-custom-options:
      s3-access-key-id: <ACCESS_KEY_BUCKET_SHOP>
      s3-secret-access-key: <SECRET_KEY_BUCKET_SHOP>
      s3-no-check-bucket: true

database:
  enabled: true
  targets: ["beget:/shop/DB"]
  databases: [shop]
  # retention и compressor наследуются из defaults
