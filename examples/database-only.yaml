# Бэкап БД. Общие настройки (log, rclone.config/remote, компрессор, retention)
# берутся из /etc/kwbackup/defaults.yaml — см. examples/defaults.yaml.
project: shop

rclone:
  args:
    # BEGET выдаёт ключи на бакет, а в rclone.conf стоит env_auth = false,
    # поэтому ключи передаются флагами rclone. Файл держите с правами 0600.
    # Можно подставлять из окружения:
    #   "--s3-access-key-id=${BEGET_SHOP_KEY}"
    - "--s3-access-key-id=<ACCESS_KEY_BUCKET_SHOP>"
    - "--s3-secret-access-key=<SECRET_KEY_BUCKET_SHOP>"

database:
  enabled: true
  target: "beget:/shop/DB"
  databases: [shop]
  # retention и compressor наследуются из defaults
