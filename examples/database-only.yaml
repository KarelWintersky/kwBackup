# Только бэкап БД. Минимум, который нужен для старта.
version: 1
project: shop

log:
  file: /var/log/kwbackup/shop.log

rclone:
  config: /etc/kwbackup/rclone.conf
  remote: beget
  env:
    AWS_ACCESS_KEY_ID: ${RCLONE_KEY_ID}
    AWS_SECRET_ACCESS_KEY: ${RCLONE_SECRET}

database:
  enabled: true
  type: mysql
  host: localhost
  user: backup
  password_env: MYSQL_PWD
  compressor: zstd
  target: "beget:/shop/DB"
  databases: [shop]
  retention:
    daily:   {keep: 8}
    weekly:  {keep: 6}
    monthly: {keep: 12}
