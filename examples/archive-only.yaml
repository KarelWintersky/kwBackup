# Только tar-архив каталога (с исключениями).
version: 1
project: site

log:
  file: /var/log/kwbackup/site.log

rclone:
  config: /etc/kwbackup/rclone.conf
  remote: beget
  env:
    AWS_ACCESS_KEY_ID: ${RCLONE_KEY_ID}
    AWS_SECRET_ACCESS_KEY: ${RCLONE_SECRET}

archive:
  enabled: true
  compressor: zstd
  compressor_args: ["-9"]
  name: site
  root: /srv/site
  include: ["*"]          # весь корень, включая .env
  exclude: ["*.mp4", "*/cache/*"]
  target: "beget:/site/ARCHIVE"
  retention: {keep: 5}
