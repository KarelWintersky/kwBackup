# tar-архив каталога. Общие настройки — в /etc/kwbackup/defaults.yaml.
version: 1
project: site

rclone:
  args:
    - "--s3-access-key-id=<ACCESS_KEY_BUCKET_SITE>"
    - "--s3-secret-access-key=<SECRET_KEY_BUCKET_SITE>"

archive:
  enabled: true
  # name: site            # по умолчанию = project (здесь "site")
  root: /srv/site
  include: ["*"]          # весь корень, включая dotfiles (.env)
  exclude: ["*.mp4", "*/cache/*"]
  target: "beget:/site/ARCHIVE"
  # compressor и retention наследуются из defaults
