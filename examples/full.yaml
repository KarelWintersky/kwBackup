# kwbackup — полный пример: все ключи в одном файле.
# Системный /etc/kwbackup/defaults.yaml, если он есть, тоже применяется,
# но значения этого файла приоритетнее. В обычной эксплуатации удобнее наоборот:
# общие вещи (log, rclone.args, compressor, retention) — в defaults,
# а здесь project, upstreams, targets, databases, sources, root.
#
# Проверка после правки:
#   kwbackup -c full.yaml --check
# Пробный прогон без изменений в облаке:
#   kwbackup -c full.yaml --dry-run
#
# Секреты (ключи S3, пароли БД) писать в этот файл можно, но не
# рекомендуется: он попадает в резервные копии и репозитории. Лучше
# подставлять из окружения (${ИМЯ}) и держать значения в
# /etc/default/kwbackup. Если всё-таки пишете ключи сюда — chmod 600.

project: example          # имя проекта: lock-файлы (/run/kwbackup), логи, отчёты

# ---------------------------------------------------------------- логирование
log:
  level: info             # debug | info | warning | error (по умолчанию info)
  file: /var/log/kwbackup/example.log   # необязательно; вывод идёт и в stderr
                          # каталог создаётся автоматически

# ---------------------------------------------------------------- окружение
runtime:
  temp_dir: /tmp/kwbackup # куда пишутся дампы/архивы перед заливкой
  keep_temp: false        # true = не удалять локальную копию после заливки

# ---------------------------------------------------------------- rclone
rclone:
  binary: rclone          # путь или имя в PATH
  args:                   # к каждому вызову rclone
    - --transfers=4
    # - "--bwlimit=10M"
  # Флаги бэкенда без "--", с типами. Перекрываются в upstreams и в секциях;
  # null убирает унаследованный флаг.
  s3-custom-options:
    s3-chunk-size: 5M
    s3-upload-cutoff: 200M
  env: {}                 # переменные окружения для rclone

# ---------------------------------------------------------------- апстримы
# Куда заливать. Ключ = имя remote в targets. Хотя бы один обязателен.
upstreams:
  s3a:
    config: /etc/kwbackup/rclone_s3a.conf
    s3-custom-options:
      s3-access-key-id: ${RCLONE_KEY_ID}
      s3-secret-access-key: ${RCLONE_SECRET}
      s3-no-check-bucket: true
  s3b:
    config: /etc/kwbackup/rclone_s3b.conf
    # можно и через переменные окружения rclone, если провайдер это умеет
    env:
      AWS_ACCESS_KEY_ID: ${RCLONE_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${RCLONE_SECRET}

# ---------------------------------------------------------------- базы данных
database:
  enabled: true
  type: mariadb           # mysql | mariadb | postgres | sqlite
  host: localhost         # для sqlite — путь к файлу .db
  port: 3306              # необязательно; по умолчанию как в клиенте
  user: backup            # mysql: --user, postgres: --username
  password_env: MYSQL_PWD # имя переменной окружения с паролем;
                          # для postgres значение же копируется в PGPASSWORD
  args:                   # опции дампа; пусто = дефолты ниже
    - --single-transaction
    - --quick
    - --no-tablespaces
    - --skip-lock-tables
  # дефолты, если args не задан:
  #   mysql/mariadb: --single-transaction --quick --no-tablespaces --skip-lock-tables
  #   postgres:      --no-owner --no-privileges
  compressor: zstd        # zstd | gzip | pigz | rar | none
  compressor_args: ["-3"]
  targets:                # по одной заливке на апстрим
    - s3a:/DB
    - s3b:/DB
  # одна БД  -> <target>/DAILY, несколько -> <target>/<db>/DAILY
  databases:
    - mediamaker
    # - second_db

  # Если хост/сеть лежали в понедельник или 1-го числа, weekly/monthly копия
  # за этот период не появится. catch_up: true создаёт её при следующем
  # запуске. По умолчанию выключено (строгий паритет с bash-версией).
  catch_up: false

  # retention_mode: keep | max_age — запрещает смешивать правила в этом файле.
  # Без него каждый класс может использовать своё правило.
  retention_mode: keep

  # Правило на каждый класс: РОВНО ОДНО из keep / max_age.
  #   keep: N     — оставить N самых новых копий (устойчиво к пропускам/дублям)
  #   max_age: 7d — удалять всё старше (s/m/h/d/w)
  # Класс отключается через false или отсутствие ключа.
  retention:
    daily:
      keep: 8             # эквивалент DB_MIN_AGE_DAILY=7d
      # max_age: 7d        # альтернатива, не смешивать в одном классе
    weekly:
      keep: 6             # эквивалент DB_MIN_AGE_WEEKLY=43d
    monthly:
      keep: 12            # эквивалент DB_MIN_AGE_MONTHLY=360d
    # daily: false        # класс отключён

# ---------------------------------------------------------------- storage
storage:
  enabled: false
  mode: sync              # sync — зеркало (удаляет лишнее в облаке)
                          # copy — только добавляет/обновляет
  # s3-custom-options: {s3-access-key-id: ...}   # перекрыть для storage
  targets:
    - s3a:/STORAGE
    - s3b:/STORAGE
  sources:
    # короткая форма: каталог в облаке = basename
    - /srv/example/files
    # полная форма: явное имя каталога в облаке
    - path: /srv/example/uploads
      dest: uploads
    # весь каталог в корень контейнера:
    # - path: /srv/example/data
    #   dest: ""

# ---------------------------------------------------------------- архив
archive:
  enabled: false
  compressor: zstd        # zstd | gzip | pigz | rar | none
  compressor_args: ["-9"]
  mode: copy              # в конфиге только copy; -m sync — из CLI
  name: example           # к имени добавляется _<YYYY-MM-DD-HH-MM-SS>
  root: /srv/example      # что архивируем (каталог)
  # "*" = весь корень, включая dotfiles (.env, .git) на верхнем уровне.
  # Иначе — маски путей ОТНОСИТЕЛЬНО root, с поддержкой **:
  #   include: ["www/*", "conf/**/*.ini"]
  include: ["*"]
  exclude: ["*.mp4", "*.tmp", "*/cache/*"]
  # s3-custom-options: {s3-access-key-id: ...}   # перекрыть для архива
  targets:
    - s3a:/ARCHIVE
    - s3b:/ARCHIVE
  retention: {keep: 5}    # или {max_age: 71d}; БЕЗ ключа архив не чистится
  # retention_mode: keep
